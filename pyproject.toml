[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goto-language"
version = "0.1.0"
description = "A minimal programming language containing only labels and goto statements."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Goto Language Authors"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
goto-lang = "goto_lang.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
