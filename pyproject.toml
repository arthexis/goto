[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goto-lang"
version = "0.1.0"
description = "A tiny programming language with labels and goto"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Codex"}
]
dependencies = []

[project.scripts]
goto-lang = "goto_lang.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
